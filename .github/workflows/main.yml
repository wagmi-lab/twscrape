name: Deploy to PyPI

on:
  push:
    branches:  
      - feature/dev
  
jobs:
  deploy:
    runs-on: self-hosted
    name: Deploy using worker_1
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          # replace setup.py 0.0.1 with a variable
          input="0.0.${{ github.run_number }}"
          echo "New Version: $input"
          sed -i "s/version = \"0.0.1\"/version = \"$input\"/g" pyproject.toml
          python -m build
          #  python setup.py sdist upload -r local
          python -m twine upload  -r local dist/*

      - uses: EndBug/latest-tag@latest
        with:
          # You can change the name of the tag or branch with this input.
          # Default: 'latest'
          ref: "0.0.${{ github.run_number }}"  
